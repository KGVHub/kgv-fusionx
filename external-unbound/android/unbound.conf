# KGV FusionX: Unbound as the phone's own DNS resolver.
#
# Every app's DNS query is redirected here (kgv_dns_redirect). By default
# Unbound resolves recursively from the root servers itself, so no DNS
# provider sees the full list of sites you visit, and checks DNSSEC so
# answers can't be forged. Sized for a 3 GB phone.

server:
    interface: 127.0.0.1
    interface: ::1
    port: 5353
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow

    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/data/misc/kgv_unbound"
    pidfile: ""
    use-syslog: no
    verbosity: 0
    log-servfail: no

    num-threads: 1
    outgoing-range: 256
    num-queries-per-thread: 128
    so-reuseport: no
    msg-cache-size: 4m
    rrset-cache-size: 8m
    key-cache-size: 2m
    neg-cache-size: 1m
    infra-cache-numhosts: 2000

    # Privacy
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes
    minimal-responses: yes

    # Security
    auto-trust-anchor-file: "/data/misc/kgv_unbound/root.key"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    use-caps-for-id: no
    aggressive-nsec: yes
    val-clean-additional: yes
    unwanted-reply-threshold: 10000

    # Speed: keep popular answers fresh and answer from stale cache while
    # refreshing, which hides the slow first lookups of a recursive resolver.
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    cache-min-ttl: 60

    # Local names (home PC, router) still resolve through mDNS/the network.
    domain-insecure: "local"
    domain-insecure: "home.arpa"

include-toplevel: "/data/misc/kgv_unbound/forward.conf"
